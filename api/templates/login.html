{% extends "base.html" %}

{% block content %}
<div class="glass-panel">
    <h1>Área Restrita</h1>
    <p class="subtitle">Faça login para acessar o sistema de gestão</p>

    <form method="POST" action="/login">
        <div class="input-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required placeholder="Digite seu usuário">
        </div>
        <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required placeholder="Digite sua senha">
        </div>
        {% if error %}
        <p style="color: #ef4444; font-size: 14px; text-align: center; margin-bottom: 15px;">{{ error }}</p>
        {% endif %}
        <button type="submit" class="btn">Entrar</button>
    </form>
</div>
{% endblock %}
